name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build native helper (spitool)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            -O2 -fPIE -pie -s -o app/src/main/jniLibs/arm64-v8a/libspitool.so native/spitool.c -ldl
          ls -l app/src/main/jniLibs/arm64-v8a/
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|error:" -A2 build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SPI-Studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
